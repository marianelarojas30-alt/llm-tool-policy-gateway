name: preflight

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m compileall -q src
      - name: Validate policy and scenarios
        run: python -c "import json,pathlib; json.loads(pathlib.Path('policies/gateway_policy.json').read_text()); json.loads(pathlib.Path('scenarios/gateway_test_cases.json').read_text())"
      - name: Run deterministic gateway tests
        run: python src/run_gateway_tests.py
